name: AI Code Review (via Tailscale)

on:
  pull_request: 
    types: [opened, synchronize]
  workflow_dispatch:  

permissions:
  contents: read      # Для чтения кода
  pull-requests: write # ДЛЯ ЗАПИСИ КОММЕНТАРИЕВ (решает ошибку 403)    

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "Secret is EMPTY"
            exit 1
          fi    

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}         
          tags: tag:ci

      - name: Get git diff
        id: diff_step
        run: |
          # 1. Автоматически определяем дефолтную ветку репозитория (если это не PR)
          # Используем API или просто берем ту, куда указывает репозиторий
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          
          # 2. Определяем базовую ветку для сравнения
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=$DEFAULT_BRANCH
          fi
          
          echo "Base branch is determined as: $BASE_BRANCH"
          
          # 3. Подтягиваем базовую ветку, чтобы git её увидел
          git fetch origin $BASE_BRANCH --depth=100
          
          # 4. Выполняем сравнение
          git diff origin/$BASE_BRANCH HEAD -- . ':(exclude)*.lock' > diff.txt
          
          # 5. Выводим результат для следующих шагов
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "Changes found."
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Network Diagnostic
        run: |
          tailscale status
          # Пробуем просто достучаться до API
          curl -v --connect-timeout 10 ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}/api/tags  
          
      - name: AI Review
        if: steps.diff_step.outputs.has_diff == 'true'
        id: ollama_step
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}
          MODEL: "qwen2.5-coder:1.5b"
        run: |
          # 1. Prepare the prompt safely using a file to avoid shell arg limits
          echo "Review the following git diff and provide concise improvement suggestions:" > prompt.txt
          cat diff.txt >> prompt.txt

          # 2. Create the JSON payload using jq from files
          jq -n --arg model "$MODEL" --arg prompt "$(<prompt.txt)" \
            '{model: $model, prompt: $prompt, stream: false}' > payload.json

          # 3. Increase timeout and capture HTTP status code
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          # 4. Separate body and status
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Ollama returned status $HTTP_STATUS"
            echo "results=AI Review failed (Server error: $HTTP_STATUS)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 5. Extract results
          REVIEW=$(echo "$BODY" | jq -r '.response // "Error: Empty response from AI"')
          
          # 6. Save to output using a random delimiter for safety
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "results<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Comment PR
        if: steps.diff_step.outputs.has_diff == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🤖 AI Code Review (Tailscale)
            ${{ steps.ollama_step.outputs.results }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
