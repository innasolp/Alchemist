name: AI Code Review (via Tailscale)

on:
  pull_request: 
    types: [opened, synchronize]
  workflow_dispatch:  

permissions:
  contents: read      # Для чтения кода
  pull-requests: write # ДЛЯ ЗАПИСИ КОММЕНТАРИЕВ (решает ошибку 403)    

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "Secret is EMPTY"
            exit 1
          fi    
          
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}         
          tags: tag:ci

      - name: Get git diff
        id: diff_step
        run: |
          git fetch origin ${{ github.base_ref }} --depth=100
          git fetch origin ${{ github.head_ref }} --depth=100
          # 1. Получаем список файлов (исключая lock-файлы)
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- . ':(exclude)*.lock')
          
          # Сохраняем список файлов для комментария (заменяем переносы строк на запятые для краткости)
          FILE_LIST=$(echo "$FILES" | tr '\n' ' ' | sed 's/ $//')
          echo "files_checked=$FILE_LIST" >> $GITHUB_OUTPUT
          # 2. Генерируем сам diff
          git diff origin/${{ github.base_ref }}...HEAD -- . ':(exclude)*.lock' > diff.txt
          
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Network Diagnostic
        run: |
          tailscale status
          # Пробуем просто достучаться до API
          curl -v --connect-timeout 10 ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}/api/tags  
          
      - name: AI Review
        if: steps.diff_step.outputs.has_diff == 'true'
        id: ollama_step
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}
          MODEL: "qwen2.5-coder:1.5b"
        run: |
          # 1. Create a strong descriptive prompt
          cat << 'EOF' > system_prompt.txt
          You are a Senior Software Architect. Provide a detailed, human-readable analysis of the following code changes. 
          DO NOT return JSON. Use clear headings and bullet points.

          Structure your response exactly like this:
          1. **Overview**: A high-level summary of what these snippets do together.
          2. **Component Breakdown**: Describe each class/method's role (e.g., Background Services, DbContext, Handlers).
          3. **Architecture & Patterns**: Note the design patterns used (e.g., Outbox pattern, DI).
          4. **Critical Analysis**: Point out potential bugs, security risks (like hardcoded strings), or performance issues.

          Review the following git diff:
          EOF

          # 2. Append the diff
          cat diff.txt >> system_prompt.txt

          # 3. Create payload with lower temperature for stability
          jq -n \
            --arg model "$MODEL" \
            --rawfile prompt system_prompt.txt \
            '{model: $model, prompt: $prompt, stream: false, options: {temperature: 0.3, num_ctx: 4096}}' > payload.json

          # 4. Request
          RESPONSE=$(curl -s -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          # 5. Extract
          REVIEW=$(echo "$RESPONSE" | jq -r '.response // "Error: No AI response"')
          
          # 6. Safe output
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "results<<$EOF_MARKER"
            echo "$REVIEW"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"

          
      - name: Comment PR
        if: steps.diff_step.outputs.has_diff == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🤖 AI Code Review (Tailscale)
            ${{ steps.ollama_step.outputs.results }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
