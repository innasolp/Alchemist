name: AI Code Review (via Tailscale)

on:
  pull_request: 
    types: [opened, synchronize]
  workflow_dispatch:  

permissions:
  contents: read      # Для чтения кода
  pull-requests: write # ДЛЯ ЗАПИСИ КОММЕНТАРИЕВ (решает ошибку 403)    

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "Secret is EMPTY"
            exit 1
          fi    
          
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}         
          tags: tag:ci

      - name: Get git diff
        id: diff_step
        run: |
          git fetch origin ${{ github.base_ref }} --depth=100
          git fetch origin ${{ github.head_ref }} --depth=100
          # 1. Получаем список файлов (исключая lock-файлы)
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- . ':(exclude)*.lock')
          
          # Сохраняем список файлов для комментария (заменяем переносы строк на запятые для краткости)
          FILE_LIST=$(echo "$FILES" | tr '\n' ' ' | sed 's/ $//')
          echo "files_checked=$FILE_LIST" >> $GITHUB_OUTPUT
          # 2. Генерируем сам diff
          git diff origin/${{ github.base_ref }}...HEAD -- . ':(exclude)*.lock' > diff.txt
          
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Network Diagnostic
        run: |
          tailscale status
          # Пробуем просто достучаться до API
          curl -v --connect-timeout 10 ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}/api/tags  
          
      - name: AI Review
        if: steps.diff_step.outputs.has_diff == 'true'
        id: ollama_step
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}
          MODEL: "qwen2.5-coder:1.5b"
        run: |
          # Используем расширенный промпт для маленькой модели
          cat << 'EOF' > instruction.txt
          You are a professional code reviewer. Your task is to analyze the provided GIT DIFF.
          
          Follow these steps:
          1. Briefly explain what changed in each file.
          2. Check for architectural issues (DI, patterns, Outbox logic).
          3. Look for security risks (connection strings, hardcoded secrets, resource disposal).
          
          Format: Use Markdown with Bold headers. Do NOT use JSON.
          
          GIT DIFF:
          EOF

          cat diff.txt >> instruction.txt

          # Отправляем через API генерации, но с явным указанием не быть "JSON-ботом"
          jq -n \
            --arg model "$MODEL" \
            --rawfile prompt instruction.txt \
            '{
              model: $model, 
              prompt: $prompt, 
              stream: false, 
              options: { 
                temperature: 0.4, 
                top_p: 0.9,
                num_predict: 1000
              }
            }' > payload.json

          RESPONSE=$(curl -s -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          REVIEW=$(echo "$RESPONSE" | jq -r '.response // "Error: No AI response"')

          # Безопасная передача в GitHub Actions
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "results<<$EOF_MARKER"
            echo "$REVIEW"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
          
      - name: Comment PR
        if: steps.diff_step.outputs.has_diff == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🤖 AI Code Review (Tailscale)
            ${{ steps.ollama_step.outputs.results }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
