name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Create Config
        run: |
          # Создаем файл с точным именем, которое ищет библиотека конфигурации
          cat <<EOF > .ai-review.yaml
          llm:
            provider: ollama
            model: qwen2.5-coder
            extra_params:
              base_url: http://localhost:11434
          vcs:
            provider: github
          EOF

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Монтируем файл напрямую в корень контейнера (/)
          # и в рабочую директорию проекта (/repo)
          docker run --rm \
            --network="host" \
            -e GITHUB_TOKEN=$GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            -e GITHUB_PULL_REQUEST_NUMBER=${{ github.event.pull_request.number }} \
            -v $(pwd)/.ai-review.yaml:/.ai-review.yaml \
            -v $(pwd)/.ai-review.yaml:/repo/.ai-review.yaml \
            -v $(pwd):/repo \
            nikitafilonov/ai-review:latest \
            ai-review review
