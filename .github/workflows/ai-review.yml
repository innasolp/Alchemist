name: AI Code Review (via Tailscale)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Get git diff
        id: diff_step
        run: |
          git diff origin/${{ github.base_ref }} HEAD -- . ':(exclude)*.lock' > diff.txt
          echo "has_diff=$( [ -s diff.txt ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT

      - name: AI Review
        if: steps.diff_step.outputs.has_diff == 'true'
        id: ollama_step
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_ENDPOINT }}
          MODEL: "qwen2.5-coder:7b"
        run: |
          # Используем обычный curl, никакой защиты туннеля не нужно, так как сеть частная
          JSON_PAYLOAD=$(jq -n --arg prompt "Review this code:\n$(cat diff.txt)" '{model: "'$MODEL'", prompt: $prompt, stream: false}')
          
          RESPONSE=$(curl -s -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          REVIEW=$(echo "$RESPONSE" | jq -r '.response // "Error: No AI response"')
          
          {
            echo "results<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR
        if: steps.diff_step.outputs.has_diff == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🤖 AI Code Review (Tailscale)
            ${{ steps.ollama_step.outputs.results }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
