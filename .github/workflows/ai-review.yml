name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  review:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    
    runs-on: self-hosted # Теперь это ваш Docker-раннер

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Review
        # Откатываемся на версию с простым конфигом
        uses: Nikita-Filonov/ai-review@v0.25.0
        env:
          # Провайдеры
          VCS__PROVIDER: GITHUB
          LLM__PROVIDER: OLLAMA

          # Структура для GITHUB (vcs.GITHUB.http_client и vcs.GITHUB.pipeline)
          VCS__GITHUB__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCS__GITHUB__PIPELINE__PULL_REQUEST__ID: ${{ github.event.pull_request.number || github.event.issue.number }}

          # Структура для OLLAMA (llm.OLLAMA.http_client и llm.OLLAMA.meta)
          # Именно эти ключи Pydantic ищет внутри объекта OLLAMA
          LLM__OLLAMA__HTTP_CLIENT__BASE_URL: http://docker.internal
          LLM__OLLAMA__META__MODEL: qwen2.5-coder:1.5b

          # Параметры ревью
          REVIEW__CORE__LANGUAGE: "English"
          REVIEW__CORE__SUMMARY_REPORT: "true"
          REVIEW__CORE__SYSTEM_PROMPT: "Senior C# Developer review."
          
          # Тип комментариев
          VCS__GITHUB__PULL_REQUEST__COMMENTS__TYPE: INLINE
