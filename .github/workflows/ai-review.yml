name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Pull Model
        run: docker exec -it ollama ollama pull qwen2.5-coder:1.5b
      - name: Run AI Review
        run: |
          docker run --rm --network="host" \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -v $(pwd):/repo nikitafilonov/ai-review:latest \
            ai-review review --provider ollama \
            --model qwen2.5-coder:7b
