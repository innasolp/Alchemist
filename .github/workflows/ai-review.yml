name: AI Code Review

permissions:
  contents: read
  pull-requests: write  # Обязательно для комментариев

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Review
        uses: Nikita-Filonov/ai-review@main # Или конкретная версия
        env:
            LLM__PROVIDER: "OPENROUTER"
            LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENROUTER_API_TOKEN }}
            # Try WITHOUT the trailing slash now, as some tool versions double it
            LLM__HTTP_CLIENT__API_URL: "https://openrouter.ai"
            
            # Switch to a more stable free model
            LLM__MODEL_ID: "google/gemini-2.0-flash-exp:free"
            
            # This field is often used as the 'X-Title' header in some tools
            LLM__META__NAME: "AI-Review-Bot"
