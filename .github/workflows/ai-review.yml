name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run AI Review
        run: |
          docker run --rm \
            --network="host" \
            -e AI_REVIEW_LLM__EXTRA_PARAMS__BASE_URL="http://localhost:11434" \
            # ... остальные переменные
            nikitafilonov/ai-review:latest \
            ai-review review
