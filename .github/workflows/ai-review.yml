name: AI Code Review (Local Python)

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  review:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    
    runs-on: self-hosted # Ваш локальный раннер (run.cmd)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Review
        shell: powershell
        env:
          # Токен и ID для связи с GitHub
          VCS__GITHUB__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCS__GITHUB__PIPELINE__PULL_REQUEST__ID: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          ai-review run `
            --vcs-provider GITHUB `
            --llm-provider OLLAMA `
            --llm-ollama-http-client-base-url "http://localhost:11434" `
            --llm-ollama-meta-model "qwen2.5-coder:1.5b" `
            --review-core-language "English" `
            --review-core-summary-report true `
            --review-core-system-prompt "You are a Senior C# Developer. Review code for bugs and logic errors."
