name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  review:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    
    runs-on: self-hosted # Теперь это ваш Docker-раннер

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Review
        uses: Nikita-Filonov/ai-review@v0.27.0
        env:
          env:
          # ВАЖНО: Указываем провайдеров ЗАГЛАВНЫМИ буквами
          VCS__PROVIDER: GITHUB
          LLM__PROVIDER: OLLAMA

          # Авторизация GitHub
          VCS__GITHUB__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Настройки Ollama (структура в соответствии с логами Pydantic)
          LLM__OLLAMA__HTTP_CLIENT__BASE_URL: http://docker.internal
          LLM__OLLAMA__META__MODEL: qwen2.5-coder:1.5b
          
          # Основные настройки ревью
          REVIEW__CORE__LANGUAGE: "English"
          REVIEW__CORE__SUMMARY_REPORT: true
          REVIEW__CORE__SYSTEM_PROMPT: |
            You are a Senior C#/.NET Software Engineer. 
            Review the provided code changes for:
            1. Critical bugs and security vulnerabilities.
            2. Best practices (SOLID, DRY, KISS).
            3. Efficient use of LINQ, async/await, and memory management.
          
          # Настройки комментариев
          VCS__PULL_REQUEST__COMMENTS__TYPE: INLINE
