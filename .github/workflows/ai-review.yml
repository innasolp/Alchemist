name: AI Code Review

on:
  # Запуск при открытии PR или добавлении новых коммитов
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.cs' # Анализируем только C# файлы
  # Запуск по команде /review в комментариях
  issue_comment:
    types: [created]
  # Возможность запустить вручную кнопкой
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # Нужно для публикации комментариев в PR

jobs:
  review:
    # Условие: запускать, если это PR, ручной запуск или комментарий "/review"
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    
    runs-on: [self-hosted, docker] # Используем ваш Docker-раннер

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Review (Final Fix)
        shell: bash
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/src \
            nikitafilonov/ai-review:latest ai-review run \
            --vcs-provider GITHUB \
            --vcs-github-http-client-api-token "${{ secrets.GITHUB_TOKEN }}" \
            --vcs-github-pipeline-pull-request-id "${{ github.event.pull_request.number || github.event.issue.number }}" \
            --llm-provider OLLAMA \
            --llm-ollama-http-client-base-url "http://localhost:11434" \
            --llm-ollama-meta-model "qwen2.5-coder:1.5b" \
            --review-core-language "English" \
            --review-core-summary-report true \
            --review-core-system-prompt "You are a Senior C# Developer. Review for logic and async errors." \
            --path /src
