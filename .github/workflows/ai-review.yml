name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
  
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    
    runs-on: self-hosted # Теперь это ваш Docker-раннер

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run AI Review (Docker)
        run: |
          docker run --rm \
            -e VCS__PROVIDER=GITHUB \
            -e VCS__GITHUB__HTTP_CLIENT__API_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e VCS__GITHUB__PIPELINE__PULL_REQUEST__ID=${{ github.event.pull_request.number || github.event.issue.number }} \
            -e LLM__PROVIDER=OLLAMA \
            -e LLM__OLLAMA__HTTP_CLIENT__BASE_URL=http://docker.internal \
            -e LLM__OLLAMA__META__MODEL=qwen2.5-coder:1.5b \
            -e REVIEW__CORE__LANGUAGE=English \
            -e REVIEW__CORE__SUMMARY_REPORT=true \
            -e REVIEW__CORE__SYSTEM_PROMPT="Senior C# Developer review." \
            -v ${{ github.workspace }}:/src \
            nikitafilonov/ai-review:latest run --path /src
