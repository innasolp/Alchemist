name: AI Code Review

permissions:
  contents: read
  pull-requests: write  # Обязательно для комментариев

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Review
        uses: Nikita-Filonov/ai-review@main # Или конкретная версия
        env:
          # Настройки LLM
          LLM__PROVIDER: "OPENROUTER"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENROUTER_API_TOKEN }}
          LLM__HTTP_CLIENT__API_URL: "https://openrouter.ai"
          LLM__MODEL_ID: "google/gemini-2.0-flash-exp:free"
          LLM__META__NAME: "AI-Review-Bot"
        
          # Настройки VCS (Используем провайдер GITEA для обхода бага с URL)
          VCS__PROVIDER: "GITEA" 
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Теперь этот URL точно будет использован:
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__PIPELINE__OWNER: "innasolp"
          VCS__PIPELINE__REPO: "Alchemist"
          VCS__PIPELINE__PULL_NUMBER: "378"
