name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Create Config
        run: |
          # Создаем файл с точным именем, которое ищет библиотека конфигурации
          cat <<EOF > .ai-review.yaml
          llm:
            provider: ollama
            model: qwen2.5-coder
            extra_params:
              base_url: http://localhost:11434
          vcs:
            provider: github
          EOF

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Записываем весь конфиг в одну переменную как JSON
          AI_CONFIG: >
            {
              "llm": {
                "provider": "ollama",
                "model": "qwen2.5-coder",
                "extra_params": { "base_url": "http://localhost:11434" }
              },
              "vcs": {
                "provider": "github"
              }
            }
        run: |
          docker run --rm \
            --network="host" \
            -v $(pwd):/repo \
            -e GITHUB_TOKEN=$GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            -e GITHUB_PULL_REQUEST_NUMBER=${{ github.event.pull_request.number }} \
            -e SETTINGS_JSON="$AI_CONFIG" \
            nikitafilonov/ai-review:latest \
            ai-review review
