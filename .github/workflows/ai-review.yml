name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
  
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    
    runs-on: self-hosted # Теперь это ваш Docker-раннер

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run AI Review (Final Mount Fix)
        shell: bash
        run: |
          # 1. Создаем конфиг-файл
          cat << 'EOF' > ai-review.toml
          [vcs]
          provider = "GITHUB"
          [vcs.github.http_client]
          api_token = "${VCS_TOKEN}"
          [vcs.github.pipeline.pull_request]
          id = "${PR_ID}"
          
          [llm]
          provider = "OLLAMA"
          [llm.ollama.http_client]
          base_url = "http://docker.internal"
          [llm.ollama.meta]
          model = "qwen2.5-coder:1.5b"
          
          [review.core]
          language = "English"
          summary_report = true
          system_prompt = "Senior C# Developer. Check for bugs and async/await issues."
          EOF

          # 2. Запускаем с абсолютными путями
          # Мы монтируем конфиг в корень (/) и код в (/src)
          docker run --rm \
            -v "${{ github.workspace }}/ai-review.toml:/ai-review.toml" \
            -v "${{ github.workspace }}:/src" \
            --entrypoint ai-review \
            -e VCS_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e PR_ID="${{ github.event.pull_request.number || github.event.issue.number }}" \
            nikitafilonov/ai-review:latest run --path /src --config /ai-review.toml
