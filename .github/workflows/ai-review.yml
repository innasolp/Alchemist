name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
  
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    
    runs-on: self-hosted # Теперь это ваш Docker-раннер

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install ai-review
        shell: bash
        run: pip install ai-review==0.27.0

      - name: Run AI Review
        shell: bash
        env:
          # Токен GitHub
          VCS__GITHUB__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ID пулл-реквеста
          VCS__GITHUB__PIPELINE__PULL_REQUEST__ID: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          ai-review run \
            --vcs-provider GITHUB \
            --llm-provider OLLAMA \
            --llm-ollama-http-client-base-url "http://docker.internal" \
            --llm-ollama-meta-model "qwen2.5-coder:1.5b" \
            --review-core-language "English" \
            --review-core-summary-report true \
            --review-core-system-prompt "You are a Senior C# Developer. Review code for bugs and logic errors."
