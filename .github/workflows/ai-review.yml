name: AI Code Review (Alpine/Ollama)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get git diff
        id: diff_step
        run: |
          git diff origin/${{ github.base_ref }} HEAD -- . ':(exclude)*.lock' ':(exclude)*.json' > diff.txt
          # Проверяем, есть ли что ревьюить
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
          fi

      - name: AI Review via Ollama
        if: steps.diff_step.outputs.has_diff == 'true'
        id: ollama_step
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_ENDPOINT }}
          MODEL: "qwen2.5-coder:7b" 
        run: |
          # Формируем JSON корректно через jq
          JSON_PAYLOAD=$(jq -n --arg prompt "Review this code for bugs and logic errors. Keep it concise:\n$(cat diff.txt)" \
            '{model: "'$MODEL'", prompt: $prompt, stream: false}')

          RESPONSE=$(curl --retry 3 -s -X POST "$OLLAMA_URL/api/generate" \
            -H "Content-Type: application/json" \
            -H "Bypass-Tunnel-Reminder: true" \
            -d "$JSON_PAYLOAD")

          # Извлекаем текст
          REVIEW=$(echo "$RESPONSE" | jq -r '.response // "No response from AI"')

          # Записываем в Output шага (используем разделитель для многострочного текста)
          {
            echo "results<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR
        if: steps.diff_step.outputs.has_diff == 'true' && steps.ollama_step.outputs.results != ''
        uses: thollander/actions-comment-pull-request@v2
        with:
          # Теперь обращаемся к outputs конкретного шага
          message: |
            ### 🤖 AI Code Review
            ${{ steps.ollama_step.outputs.results }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
