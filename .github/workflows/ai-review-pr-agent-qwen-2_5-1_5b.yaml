name: AI Code Review Codium PR-agent (via Tailscale)

on:
  pull_request: 
    types: [opened, synchronize]
  issue_comment:
    types: [created]  
  workflow_dispatch:  
  
permissions:
  contents: read      # Для чтения кода
  pull-requests: write # ДЛЯ ЗАПИСИ КОММЕНТАРИЕВ (решает ошибку 403)    

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "Secret is EMPTY"
            exit 1
          fi    

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}         
          tags: tag:ci

      - name: Get git diff
        id: diff_step
        run: |
          # 1. Автоматически определяем дефолтную ветку репозитория (если это не PR)
          # Используем API или просто берем ту, куда указывает репозиторий
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          
          # 2. Определяем базовую ветку для сравнения
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=$DEFAULT_BRANCH
          fi
          
          echo "Base branch is determined as: $BASE_BRANCH"
          
          # 3. Подтягиваем базовую ветку, чтобы git её увидел
          git fetch origin $BASE_BRANCH --depth=100
          
          # 4. Выполняем сравнение
          git diff origin/$BASE_BRANCH HEAD -- . ':(exclude)*.lock' > diff.txt
          
          # 5. Выводим результат для следующих шагов
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "Changes found."
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Network Diagnostic
        run: |
          tailscale status
          # Пробуем просто достучаться до API
          curl -v --connect-timeout 10 ${{ secrets.OLLAMA_ENDPOINT }}/api/tags  
          # пробуем отправить небольшой файл через POST
          TEST_RESPONSE=$(curl -X POST -d '{"model":"qwen2.5-coder:1.5b","prompt":"hi", "stream": false}' ${{ secrets.OLLAMA_ENDPOINT }}/api/generate)
          echo "Test response on 'hi' from Ollama: $TEST_RESPONSE"

          
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          CONFIG_MODEL: "ollama/qwen2.5-coder:3b"
          CONFIG_MAX_MODEL_TOKENS: 16000
          OLLAMA_CONTEXT_LENGTH: 16000
          OLLAMA_API_BASE: "${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: true
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER.SYSTEM_PROMPT: "You are a suspicious Security Auditor..." 
          # 'with' must be at the same indentation level as 'uses' and 'env'
          GITHUB_ACTION_CONFIG_HANDLE_SYNCHRONIZE_EVENTS: true
        with:
             command: "/review"
