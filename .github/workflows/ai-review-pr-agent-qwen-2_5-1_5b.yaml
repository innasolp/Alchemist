name: AI Code Review Codium PR-agent (via Tailscale)

on:
  pull_request: 
    types: [opened, synchronize]
  workflow_dispatch:  

permissions:
  contents: read      # Для чтения кода
  pull-requests: write # ДЛЯ ЗАПИСИ КОММЕНТАРИЕВ (решает ошибку 403)    

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "Secret is EMPTY"
            exit 1
          fi    

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}         
          tags: tag:ci

      - name: Get git diff
        id: diff_step
        run: |
          # 1. Автоматически определяем дефолтную ветку репозитория (если это не PR)
          # Используем API или просто берем ту, куда указывает репозиторий
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          
          # 2. Определяем базовую ветку для сравнения
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=$DEFAULT_BRANCH
          fi
          
          echo "Base branch is determined as: $BASE_BRANCH"
          
          # 3. Подтягиваем базовую ветку, чтобы git её увидел
          git fetch origin $BASE_BRANCH --depth=100
          
          # 4. Выполняем сравнение
          git diff origin/$BASE_BRANCH HEAD -- . ':(exclude)*.lock' > diff.txt
          
          # 5. Выводим результат для следующих шагов
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "Changes found."
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Network Diagnostic
        run: |
          tailscale status
          # Пробуем просто достучаться до API
          curl -v --connect-timeout 10 ${{ secrets.OLLAMA_ENDPOINT }}/api/tags  
          # пробуем отправить небольшой файл через POST
          TEST_RESPONSE=$(curl -X POST -d '{"model":"qwen2.5-coder:1.5b","prompt":"hi", "stream": false}' ${{ secrets.OLLAMA_ENDPOINT }}/api/generate)
          echo "Test response on 'hi' from Ollama: $TEST_RESPONSE"

          
      - name: AI Review
        if: steps.diff_step.outputs.has_diff == 'true'
        id: ollama_step
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_ENDPOINT }}
          MODEL: "qwen2.5-coder:3b"
        run: |
          # 1. Prepare a clear instruction
          cat <<EOF > instructions.txt
          You are a professional code reviewer. 
          Review the following git diff for bugs and improvements. 
          Keep your response short and in Markdown format.
          
          --- DIFF START ---
          $(cat diff.txt)
          --- DIFF END ---
          EOF

          # 2. Build the JSON safely
          jq -n \
            --arg model "$MODEL" \
            --rawfile prompt instructions.txt \
            '{model: $model, prompt: $prompt, stream: false, options: {num_predict: 500}}' > payload.json

          # 3. Request
          RESPONSE=$(curl -s -X POST "${OLLAMA_URL%/}/api/generate" \
            --max-time 1200 \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          # 4. Extract ONLY the AI text
          # We use -r to get raw text and avoid extra quotes
          REVIEW=$(echo "$RESPONSE" | jq -r '.response // "Error: AI returned empty response"')

          # 5. Output for the next step
          {
            echo "results<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      - name: Comment PR
        if: steps.diff_step.outputs.has_diff == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🤖 AI Code Review (Tailscale)
            ${{ steps.ollama_step.outputs.results }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
