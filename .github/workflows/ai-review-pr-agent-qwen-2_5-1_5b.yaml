name: AI Code Review Codium PR-agent (via Tailscale)

on:
  workflow_dispatch: 
    inputs:
      pr_number:
        description: 'Input pull request number'
        required: true
        type: string
  
jobs:
  review:
    runs-on: ubuntu-latest
    permissions: # Добавьте этот блок
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "Secret is EMPTY"
            exit 1
          fi    

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}         
          tags: tag:ci

      - name: Get git diff
        id: diff_step
        run: |
          # 1. Автоматически определяем дефолтную ветку репозитория (если это не PR)
          # Используем API или просто берем ту, куда указывает репозиторий
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          
          # 2. Определяем базовую ветку для сравнения
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=$DEFAULT_BRANCH
          fi
          
          echo "Base branch is determined as: $BASE_BRANCH"
          
          # 3. Подтягиваем базовую ветку, чтобы git её увидел
          git fetch origin $BASE_BRANCH --depth=100
          
          # 4. Выполняем сравнение
          git diff origin/$BASE_BRANCH HEAD -- . ':(exclude)*.lock' > diff.txt
          
          # 5. Выводим результат для следующих шагов
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "Changes found."
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Network Diagnostic
        run: |
          tailscale status
          # Пробуем просто достучаться до API
          curl -v --connect-timeout 10 ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}/api/tags  
          # пробуем отправить небольшой файл через POST
          TEST_RESPONSE=$(curl -X POST -d '{"model":"qwen2.5-coder:1.5b","prompt":"hi", "stream": false}' ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}/api/generate)
          echo "Test response on 'hi' from Ollama: $TEST_RESPONSE"

          
      - name: Run PR Agent
        run: |
          # Создаем файл конфигурации
          cat <<EOF > /tmp/.pr_agent.toml
          [litellm]
          timeout = 1200
          
          [ollama]
          api_base = "$OLLAMA_ENDPOINT"
          EOF
          
          docker run --rm \
            -v ${{ github.workspace }}:/github/workspace \
            -v /tmp/.pr_agent.toml:/app/.pr_agent.toml \
            -w /app \
            -e GITHUB__USER_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e CONFIG__MODEL="ollama/qwen2.5-coder:7b" \
            -e CONFIG__FALLBACK_MODELS='["ollama/qwen2.5-coder:3b"]' \
            -e CONFIG__CUSTOM_MODEL_MAX_TOKENS="32000" \
            codiumai/pr-agent:latest \
            --pr_url="${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}" \
            --config.path=/app/.pr_agent.toml review
        env:
          OLLAMA_ENDPOINT: ${{ secrets.OLLAMA_QWEN_7B_ENDPOINT }}    

