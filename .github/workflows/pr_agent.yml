name: Qodo Reviewer (PR-Agent)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/')) }}
    name: Run Qodo Reviewer
    steps:
      - name: Qodo Reviewer Action
        uses: Codium-ai/pr-agent@main
        env:
          # Токен OpenAI (добавьте в Settings -> Secrets вашего репозитория)
          OPENAI.KEY: ${{ secrets.OPENAI_API_KEY }}  
          
          # Токен GitHub (создается автоматически, ничего настраивать не нужно)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Настройки поведения (опционально)
          CONFIG.MODEL: "gpt-4o" # или gpt-4-turbo
